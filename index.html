<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicadores de las Prioridades del Área</title>
<style>
/* Brand from the monthly presentation: navy band, gold rules, cream ground, Georgia headings. Layout: tabs → summary → 2-column grid, one priority per block. */
:root{
  --navy:#1B365D; --gold:#C9A24D; --cream:#F5F1E8; --sand:#D9D4C7; --ink:#1F2937; --muted:#6B7280; --white:#FFFFFF;
  --good:#1D7A4C; --good-soft:#E3F1E8; --bad:#B42318; --bad-soft:#F8E4E1; --flat-soft:#ECEAE4;
  --f-display:Georgia, "Times New Roman", serif;
  --f-body:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
.band{background:var(--navy);color:var(--white);border-bottom:5px solid var(--gold)}
.band-in{max-width:1240px;margin:0 auto;padding:18px 20px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.band p{margin:4px 0 0;color:var(--sand);font-size:14px}
.stamp{color:var(--sand);font-size:13px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}

nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--sand);scrollbar-width:thin}
.tab{font:inherit;border:0;background:transparent;color:var(--navy);padding:9px 12px 7px;font-weight:700;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab small{font-weight:400;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--gold)}
.tab:disabled{color:#a7a399;cursor:default}
.tab.cmp{margin-left:auto;background:var(--navy);color:var(--white);border-radius:6px 6px 0 0;padding:9px 16px}
.tab.cmp[aria-selected="true"]{border-bottom-color:var(--gold)}
.tab:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.summary{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--white);border-left:5px solid var(--gold);padding:12px 16px;box-shadow:0 1px 2px rgba(27,54,93,.08)}
.summary strong{font-family:var(--f-display);color:var(--navy);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.down{background:var(--bad-soft);color:var(--bad)}
.chip.flat{background:var(--flat-soft);color:var(--muted)}
.chip.warn{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}

.prio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.prio-grid{grid-template-columns:1fr}}
.prio{display:flex;flex-direction:column;gap:10px;min-width:0}
.prio-head{background:var(--navy);color:var(--white);display:flex;align-items:center;gap:12px;padding:10px 14px}
.prio-head svg{width:34px;height:34px;flex:none}
.prio-head h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}

.ind{background:var(--white);border-left:5px solid var(--gold);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;box-shadow:0 1px 2px rgba(27,54,93,.08);min-width:0}
.ind.alert{border-left-color:var(--bad)}
.ind-num{font-family:var(--f-display);color:var(--gold);font-weight:700;font-size:22px;line-height:1}
.ind h3{font-family:var(--f-display);color:var(--navy);font-size:16px;margin:0;line-height:1.25;text-wrap:balance}
.ind-body{grid-column:1 / -1;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;margin-top:6px}
@media (max-width:460px){.ind-body{grid-template-columns:1fr}}
.kpi{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.donut{width:112px;height:112px}
.count{font-family:var(--f-display);color:var(--navy);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .detail{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart-box{position:relative;width:100%;min-width:0}

.panel{background:var(--white);border-left:5px solid var(--gold);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 1px 2px rgba(27,54,93,.08)}
.panel h2{font-family:var(--f-display);color:var(--navy);font-size:17px;margin:0}
.panel .note{color:var(--muted);font-size:13px;margin:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--sand);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:210px}
thead th{color:var(--navy);font-weight:700;font-size:13px;background:var(--cream)}
td.na{color:#b4b0a6}

.empty{background:var(--white);border:1px dashed var(--sand);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{font:inherit;font-weight:700;background:var(--navy);color:var(--white);border:0;padding:8px 14px;border-radius:4px;cursor:pointer}
footer{max-width:1240px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:12px;border-top:4px solid var(--gold);padding-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.band-in,.wrap{padding-left:16px;padding-right:16px}h1{font-size:19px}}
</style>
</head>

function metric(m,ind){
  const d=m&&m.v&&m.v[ind.id]; if(!d) return null;
  if(ind.kind==="count") return isFinite(d.n)?{val:d.n,real:d.n}:null;
  if(ind.kind==="self"){ if(!isFinite(d.p)||!isFinite(d.h)||d.p<=0) return null; const r=d.p-d.h; return {val:r/d.p*100,real:r,pot:d.p,help:d.h}; }

  return {val:d.r/d.p*100,real:d.r,pot:d.p,over:d.r>d.p};
}

  fg.setAttribute("stroke-dasharray",(CIR*v/100).toFixed(2)+" "+CIR.toFixed(2));fg.setAttribute("transform","rotate(-90 56 56)");s.appendChild(fg);
  const tx=document.createElementNS(ns,"text");tx.setAttribute("x","56");tx.setAttribute("y","62");tx.setAttribute("text-anchor","middle");tx.setAttribute("font-family","Georgia, serif");tx.setAttribute("font-weight","700");tx.setAttribute("font-size","20");tx.setAttribute("fill",C.navy);
  tx.textContent=(val<10&&val>0?nf1.format(val):nf0.format(Math.round(val)))+" %";s.appendChild(tx);
  return s;
}

function baseOpts(extra){
  const o={responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{display:false},tooltip:{backgroundColor:C.navy,titleColor:"#fff",bodyColor:"#fff",padding:8}},
    scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{size:11}},border:{color:C.sand}},y:{grid:{color:C.grid},ticks:{color:C.muted,font:{size:11}},border:{display:false}}}};
  return deepMerge(o,extra||{});
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&typeof b[k]!=="function")a[k]=deepMerge(a[k]||{},b[k]);else a[k]=b[k];}return a;}
const valueLabels={id:"valueLabels",afterDatasetsDraw(chart){const ctx=chart.ctx;chart.data.datasets.forEach((ds,i)=>{if(ds.type==="line"||ds.noLabels)return;const meta=chart.getDatasetMeta(i);meta.data.forEach((bar,j)=>{const v=ds.data[j];if(v==null)return;ctx.save();ctx.fillStyle=C.navy;ctx.font="700 11px Calibri, Carlito, Arial";ctx.textAlign="center";ctx.fillText(ds.fmt?ds.fmt(v):v,bar.x,bar.y-5);ctx.restore();});});}};

function monthBars(canvas,ind,months,activeKey,height){
  const isPct=ind.kind!=="count";
  const vals=months.map(m=>{const x=metric(m,ind);return x?+x.val.toFixed(isPct?1:0):null;});
  const bg=months.map(m=>m.key===activeKey?C.navy:C.sand);
  const max=isPct?100:Math.max(4,Math.ceil(Math.max(...vals.filter(v=>v!=null))*1.15));
  return new Chart(canvas,{type:"bar",data:{labels:months.map(m=>m.label),datasets:[{type:"bar",data:vals,backgroundColor:bg,borderRadius:2,maxBarThickness:52,fmt:v=>isPct?nf0.format(Math.round(v))+" %":fmtInt(v)}]},
    options:baseOpts({layout:{padding:{top:16}},scales:{y:isPct?{min:0,max:100,ticks:{stepSize:25,callback:v=>v+" %"}}:{min:0,max,ticks:{precision:0}}},
      plugins:{tooltip:{callbacks:{label:cx=>{const x=metric(months[cx.dataIndex],ind);if(!x)return"Sin datos";return isPct?(nf1.format(x.val)+" % · "+fmtInt(x.real)+" de "+fmtInt(x.pot)):(fmtInt(x.val)+" misioneros");}}}}}),plugins:[valueLabels]});
}

function renderMonth(view,key){
  const m=filled.find(x=>x.key===key),prev=prevFilled(key);

    IND.filter(i=>i.pri===p.id).forEach(ind=>{
      const a=metric(m,ind),b=metric(prev,ind);

        else{kpi.appendChild(donut(a.val));kpi.appendChild(el("span",{class:"detail",text: ind.kind==="self"?(fmtInt(a.real)+" de "+fmtInt(a.pot)+" familias"):(fmtInt(a.real)+" de "+fmtInt(a.pot))}));}
        if(b){const d=a.val-b.val,c=deltaClass(d,ind);kpi.appendChild(el("span",{class:"chip "+c,title:"Frente a "+prev.label,text:arrow(c)+" "+(c==="flat"&&ind.kind==="count"?"sin cambio":fmtDelta(ind,d))}));if(c==="down"&&ind.kind!=="count"&&d<=-5)card.classList.add("alert");}

      } else kpi.appendChild(el("span",{class:"detail",text:"Sin datos este mes"}));

      const box=el("div",{class:"chart-box"});box.style.height="170px";const cv=el("canvas",{role:"img","aria-label":"Evolución mensual de "+ind.name});box.appendChild(cv);body.appendChild(box);
      card.appendChild(body);sec.appendChild(card);
      charts.push(monthBars(cv,ind,upto,m.key));
    });
    grid.appendChild(sec);
  });
  view.appendChild(grid);

  const pctInd=IND.filter(i=>i.kind!=="count");
  const panel=el("section",{class:"panel",id:"panorama"});
  panel.appendChild(el("h2",{text:"Panorama del mes: % por indicador"+(prev?" · "+prev.label+" vs "+m.label:"")}));
  const box=el("div",{class:"chart-box"});box.style.height="300px";const cv=el("canvas",{role:"img","aria-label":"Porcentaje por indicador"});box.appendChild(cv);panel.appendChild(box);view.appendChild(panel);
  const ds=[];
  if(prev)ds.push({label:prev.label,data:pctInd.map(i=>{const x=metric(prev,i);return x?+x.val.toFixed(1):null;}),backgroundColor:C.sand,borderRadius:2,fmt:v=>nf0.format(Math.round(v))+" %"});
  ds.push({label:m.label,data:pctInd.map(i=>{const x=metric(m,i);return x?+x.val.toFixed(1):null;}),backgroundColor:C.navy,borderRadius:2,fmt:v=>nf0.format(Math.round(v))+" %"});
  charts.push(new Chart(cv,{type:"bar",data:{labels:pctInd.map(i=>i.short),datasets:ds},options:baseOpts({layout:{padding:{top:16}},scales:{y:{min:0,max:100,ticks:{stepSize:25,callback:v=>v+" %"}},x:{ticks:{autoSkip:false,maxRotation:0,callback:function(v){const l=this.getLabelForValue(v);if(l.length<=14)return l;const w=l.split(" "),h=Math.ceil(w.length/2);return [w.slice(0,h).join(" "),w.slice(h).join(" ")];}}}},plugins:{legend:{display:!!prev,position:"bottom",labels:{color:C.ink,boxWidth:12,boxHeight:12}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+nf1.format(c.parsed.y)+" %"}}}}),plugins:[valueLabels]}));
}

  charts.push(new Chart(oc,{type:"line",data:{labels:all.map(m=>m.label),datasets:pctInd.map((ind,k)=>({label:ind.short,data:all.map(m=>{const x=metric(m,ind);return x?+x.val.toFixed(1):null;}),borderColor:SERIES[k],backgroundColor:SERIES[k],borderWidth:2.5,tension:.25,pointRadius:4,spanGaps:false}))},
    options:baseOpts({scales:{y:{min:0,max:100,ticks:{stepSize:25,callback:v=>v+" %"}},x:{grid:{display:false}}},plugins:{legend:{display:true,position:"bottom",labels:{color:C.ink,boxWidth:12,boxHeight:12}},tooltip:{callbacks:{label:c=>c.parsed.y==null?null:c.dataset.label+": "+nf1.format(c.parsed.y)+" %"}}}})}));

  const grid=el("div",{class:"prio-grid",id:"evolucion"});
  PRIOS.forEach(p=>{
    const sec=el("section",{class:"prio",id:"evol-"+p.id});sec.appendChild(prioHead(p));
    IND.filter(i=>i.pri===p.id).forEach(ind=>{
      const card=el("article",{class:"panel",id:"evol-"+ind.id});
      const vals=filled.map(m=>{const x=metric(m,ind);return x?x.val:null;}).filter(v=>v!=null);
      const head=el("div",{style:"display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap"});
      head.appendChild(el("h2",{text:ind.n+" · "+ind.name}));
      if(vals.length>1){const d=vals[vals.length-1]-vals[0],c=deltaClass(d,ind);head.appendChild(el("span",{class:"chip "+c,title:"Desde "+labels[0],text:arrow(c)+" "+fmtDelta(ind,d)}));}
      card.appendChild(head);
      const b=el("div",{class:"chart-box"});b.style.height="200px";const c=el("canvas",{role:"img","aria-label":"Evolución de "+ind.name});b.appendChild(c);card.appendChild(b);sec.appendChild(card);
      const isPct=ind.kind!=="count";
      const series=all.map(m=>{const x=metric(m,ind);return x?+x.val.toFixed(isPct?1:0):null;});
      const last=filled[filled.length-1].key;
      const max=isPct?100:Math.max(4,Math.ceil(Math.max(...series.filter(v=>v!=null))*1.15));
      charts.push(new Chart(c,{data:{labels:all.map(m=>m.label),datasets:[
        {type:"line",label:"Tendencia",data:series,borderColor:C.gold,backgroundColor:C.gold,borderWidth:2.5,pointRadius:3,tension:.25,spanGaps:false,order:0},
        {type:"bar",label:isPct?"% real":"Número",data:series,backgroundColor:all.map(m=>m.key===last?C.navy:C.sand),borderRadius:2,maxBarThickness:40,order:1,fmt:v=>isPct?nf0.format(Math.round(v))+" %":fmtInt(v)}
      ]},options:baseOpts({layout:{padding:{top:16}},scales:{y:isPct?{min:0,max:100,ticks:{stepSize:25,callback:v=>v+" %"}}:{min:0,max,ticks:{precision:0}},x:{ticks:{maxRotation:0,autoSkip:true}}},
        plugins:{tooltip:{filter:it=>it.dataset.type==="bar",callbacks:{label:cx=>{const x=metric(all[cx.dataIndex],ind);if(!x)return"Pendiente";return isPct?(nf1.format(x.val)+" % · "+fmtInt(x.real)+" de "+fmtInt(x.pot)):(fmtInt(x.val)+" misioneros");}}}}}),plugins:[valueLabels]}));
    });
    grid.appendChild(sec);
  });
  view.appendChild(grid);
}

/* ---------- Excel ---------- */
function monthKey(h){
  if(h==null)return null;
  if(h instanceof Date&&!isNaN(h)){const y=h.getFullYear(),mo=h.getMonth()+1;return{key:y+"-"+String(mo).padStart(2,"0"),label:MES_TXT[mo]+" "+y};}
  const s=String(h).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const mt=s.match(/^([a-z]{3})[a-z]*\.?\s*[-/ ]?\s*(\d{4})$/);if(!mt)return null;
  const mo=MES[mt[1]];if(!mo)return null;const y=+mt[2];
  return{key:y+"-"+String(mo).padStart(2,"0"),label:MES_TXT[mo]+" "+y};
}
function num(v){if(typeof v==="number"&&isFinite(v))return v;if(typeof v==="string"&&v.trim()!==""&&!isNaN(+v.replace(",",".")))return +v.replace(",",".");return null;}
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const sn=wb.SheetNames.find(n=>/captura/i.test(n));if(!sn)throw new Error("No se encuentra la hoja «Captura» en el Excel.");
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  let hr=-1,cols=[];
  for(let r=0;r<Math.min(rows.length,20);r++){const f=[];(rows[r]||[]).forEach((v,c)=>{const k=monthKey(v);if(k)f.push({c,...k});});if(f.length>=2){hr=r;cols=f;break;}}
  if(hr<0)throw new Error("No se encuentra la fila de meses (p. ej. «Sep 2026») en la hoja «Captura».");
  const rowOf={};
  for(let r=hr+1;r<rows.length;r++){const name=String((rows[r]||[])[1]||"").trim();if(!name)continue;for(const ind of IND){if(rowOf[ind.id]==null&&ind.match.test(name)){if(ind.id==="mis"&&/mayores/i.test(name))continue;rowOf[ind.id]=r;break;}}}
  const missing=IND.filter(i=>rowOf[i.id]==null).map(i=>i.name);
  if(missing.length)throw new Error("Faltan estos indicadores en «Captura»: "+missing.join(", ")+".");
  return cols.map(col=>{
    const v={};let any=false;
    IND.forEach(ind=>{const r=rowOf[ind.id];const a=num((rows[r]||[])[col.c]),b=num((rows[r+1]||[])[col.c]);
      if(ind.kind==="count"){if(a!=null){v[ind.id]={n:a};any=true;}}
      else if(ind.kind==="self"){if(a!=null&&b!=null){v[ind.id]={p:a,h:b};any=true;}}
      else if(a!=null&&b!=null){v[ind.id]={p:a,r:b};any=true;}});
    return{key:col.key,label:col.label,v:any?v:null};
  }).sort((a,b)=>a.key<b.key?-1:1);
}
function load(buf,when){
  all=parseWorkbook(buf);filled=all.filter(m=>m.v);
  if(when){const d=new Date(when);if(!isNaN(d))$("stamp").textContent="Datos actualizados el "+d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});}
  current=fromHash();render();
}
function showError(msg,offerLocal){
  const v=$("view");v.textContent="";const box=el("div",{class:"empty"});box.appendChild(el("p",{text:msg,style:"margin:0"}));
  if(offerLocal){const inp=el("input",{type:"file",id:"local-file",accept:".xlsx,.xlsm",hidden:""});const b=el("button",{class:"btn",type:"button",text:"Abrir un Excel para previsualizar"});
    b.addEventListener("click",()=>inp.click());inp.addEventListener("change",()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{load(new Uint8Array(rd.result),f.lastModified);}catch(e){showError(e.message,true);}};rd.readAsArrayBuffer(f);});
    box.appendChild(b);box.appendChild(inp);}
  v.appendChild(box);
}
(async function init(){
  if(typeof XLSX==="undefined"||typeof Chart==="undefined"){showError("No se han podido cargar los componentes del dashboard. Comprueba la conexión a internet y recarga la página.",false);return;}
  for(const f of DATA_FILES){
    let res;
    try{res=await fetch(encodeURI(f)+"?v="+Date.now(),{cache:"no-store"});}catch(e){continue;}
    if(!res.ok)continue;
    try{load(new Uint8Array(await res.arrayBuffer()),res.headers.get("Last-Modified"));}
    catch(e){showError((e&&e.message)||"No se ha podido leer el Excel «"+f+"».",false);}
    return;
  }
  showError("No se ha encontrado el Excel «"+DATA_FILES[0]+"» junto a esta página.",true);
})();
})();
